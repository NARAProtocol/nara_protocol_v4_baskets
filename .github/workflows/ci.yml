name: Baskets CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nara-baskets-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: repository · integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned source and dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify public repository
        run: node scripts/check-repository.mjs

  contracts:
    name: contracts · format · build · test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned source and dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.4.3
      - name: Record dependency pins
        run: git submodule status --recursive
      - name: Format
        run: forge fmt --check
      - name: Build and enforce bytecode limits
        run: forge build --sizes
      - name: Deterministic unit and fuzz tests
        run: >-
          forge test
          --no-match-path "test/*Fork*.t.sol"
          --no-match-contract NARAImmutableBasketPositionManagerV1InvariantTest
          -vv
      - name: CI-profile invariants
        run: forge test --match-contract NARAImmutableBasketPositionManagerV1InvariantTest -vv
        env:
          FOUNDRY_PROFILE: ci

  app:
    name: app · test · build · audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install locked app dependencies
        run: npm ci --prefix app
      - name: Dependency audit (High and Critical)
        run: npm audit --prefix app --audit-level=high
      - name: Builder, copy, parity, type, and production build checks
        run: npm run check --prefix app

  slither:
    name: slither (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Checkout pinned source and dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.4.3
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install Slither
        run: pip install slither-analyzer==0.11.3
      - name: Analyze canonical contracts
        run: >-
          slither .
          --fail-none
          --filter-paths
          "lib|test|script|src/NARAIndexFeeCollectorV1.sol|src/CategoryIndexSuiteV1.sol"

  aderyn:
    name: aderyn (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Checkout pinned source and dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.4.3
      # Cyfrin retired Aderyn upstream and withdrew all release binaries/crates.
      # Retain the required "aderyn (advisory)" check context and enforce deterministic
      # Solidity source/pragma/AST hygiene alongside Slither + Foundry builds.
      - name: Solidity static hygiene gate (basket contracts)
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import path from "node:path";
            const walk = (d) =>
              fs.readdirSync(d, { withFileTypes: true }).flatMap((e) => {
                const full = path.join(d, e.name);
                return e.isDirectory() ? walk(full) : e.name.endsWith(".sol") ? [full] : [];
              });
            const targets = walk("src");
            if (targets.length < 9) throw new Error(`Expected >= 9 Solidity targets in src/, found ${targets.length}`);
            for (const f of targets) {
              const raw = fs.readFileSync(f, "utf8");
              const code = raw.replace(/\/\*[\s\S]*?\*\//g, "").replace(/\/\/.*$/gm, "");
              if (!raw.includes("SPDX-License-Identifier:")) throw new Error(`Missing SPDX header: ${f}`);
              if (!/pragma\s+solidity\s+\^?0\.8\.(24|34)\s*;/.test(code)) throw new Error(`Unexpected pragma in ${f}`);
              if (/\b(selfdestruct|suicide)\s*\(/.test(code)) throw new Error(`Forbidden selfdestruct in ${f}`);
              if (/\btx\.origin\b/.test(code)) throw new Error(`Forbidden tx.origin in ${f}`);
            }
            console.log(`Verified ${targets.length} Solidity targets in src/.`);
          '
          forge build

  fork-adapters:
    name: fork adapters (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - name: Require configured Base RPC secret
        shell: bash
        run: |
          if [ -z "$BASE_RPC_URL" ]; then
            echo "BASE_RPC_URL is required for the manual fork gate."
            exit 1
          fi
      - name: Checkout pinned source and dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.4.3
      - name: Run Base adapter fork tests
        run: |
          forge test --match-path "test/*Fork.t.sol" --fork-url "$BASE_RPC_URL" -vv
          forge test --match-path "test/AerodromeBasketAdapterV1.t.sol" --fork-url "$BASE_RPC_URL" -vv
