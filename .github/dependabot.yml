version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      wallet-stack:
        patterns:
          - "@rainbow-me/*"
          - "@tanstack/*"
          - "viem"
          - "wagmi"
      frontend-tooling:
        patterns:
          - "@cloudflare/workers-types"
          - "@vitejs/*"
          - "vite"
          - "typescript"
          - "wrangler"
    ignore:
      # @rainbow-me/rainbowkit 2.2.x requires peer wagmi@^2.9.0 (blocks wagmi v3)
      - dependency-name: "wagmi"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 major jump breaks locked npm ci resolution for Vite/React toolchain
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    ignore:
      # Newer OZ commits use EIP-7939 clz opcode (requires Osaka EVM; Base compiles for cancun)
      - dependency-name: "lib/openzeppelin-contracts"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
